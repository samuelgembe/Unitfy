<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <title>Unitfy</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.png">
</head>
<body>
    
    <main id="main-container">

        <header id="brand-header">
            <div class="logo-wrapper">
                <img src="images/logoUnitfy.svg" alt="logo Unitfy" class="logo-icon">
            </div>
            <span class="brand-name">Unitfy</span>
        </header>

        <section id="hero-section">
            <h1 class="headline">Apples, Oranges. Whatever.</h1>
            <p class="sub-headline">A streamlined tool to bridge the gap between Metric and Imperial. <br>
                                    Convert mass, volume, and length with speed and simplicity.</p>
        </section>

        <section id="app-interface">

            <div class="tabs-container">
                <button id="btn-weight" class="tab-btn active" data-tab="weight"><i class="ph ph-scales"></i>Weight</button>
                <button id="btn-volume" class="tab-btn" data-tab="volume"><i class="ph ph-drop"></i>Volume</button>
                <button id="btn-distance" class="tab-btn" data-tab="distance"><i class="ph ph-ruler"></i>Distance</button>
            </div>

            <div class="converter-box">
                <div class="input-group">
                    <label for="input-from" id="label-from">From <span class="text-unit">Kilograms (kg)</span></label>
                    <input type="number" id="input-from" placeholder="Enter value..." > 
                </div>

                <div class="input-group">
                        <label for="input-to" id="label-to">To <span class="text-unit">Pounds (lb)</span></label>
                        <input type="number" id="input-to" placeholder="Enter value..." >
                </div>
            </div>

        </section>


        <footer class="main-footer">
            <p>Made by <a href="https://samuelgembe.framer.website/" target="_blank">Samuel Gembe</a></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
